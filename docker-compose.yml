# Local stack: dashboard on http://localhost:8080, API/WebSocket proxied by nginx.
#
#   docker compose up --build
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      PORT: "3001"
      SIM_SEED: ${SIM_SEED:-}
      BACKFILL_S: ${BACKFILL_S:-900}
    ports:
      - "3001:3001" # direct API access for development; nginx proxies it anyway
