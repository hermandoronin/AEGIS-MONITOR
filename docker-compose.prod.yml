# Shipboard / demo deployment: only the dashboard port is exposed, both
# services restart on their own after a power cut.
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    expose:
      - "3001"
    environment:
      PORT: "3001"
      SIM_SEED: ${SIM_SEED:-}
    restart: unless-stopped
