name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (protocols, alarm engine, simulator, API)
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: IO list documentation is up to date
        run: |
          npm run docs:io-list
          git diff --exit-code docs/io-list.md
