# Serves the built dashboard and proxies the API and the WebSocket to the
# monitoring server, so the browser only ever talks to one origin.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to the dashboard.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
